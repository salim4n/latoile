[package]
name = "latoile-preview"
description = "Dev-server supervision, port allocation, reverse proxy. Implements core ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
latoile-core = { path = "../core" }
tokio = { version = "1", features = ["process", "net", "time", "sync", "io-util", "rt", "fs"] }
thiserror = "2"
serde_json = "1"
# Process-group kill on unix — dev servers spawn children (npm → node), and
# killing only the direct child would orphan them (contract §3).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"
