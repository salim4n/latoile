[package]
name = "latoile-capture"
description = "Deterministic Chromium capture and immutable visual artifact storage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
latoile-core = { path = "../core" }
base64 = "0.22"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "net", "process", "rt", "time"] }
tokio-tungstenite = "0.28"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
